<!DOCTYPE html>

<style>
  @import url('https://miaoda.feishu.cn/fonts/css2?family=Quicksand:wght@600;700&family=Lato:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Lato', 'PingFang SC', sans-serif;
    background-color: #E9F5EF;
    color: #333333;
    line-height: 1.7;
    /* 星光点阵底纹 */
    background-image: radial-gradient(#cfe8dd 1.2px, transparent 1.2px);
    background-size: 26px 26px;
    padding: 24px 16px 60px;
  }

  .wrap { max-width: 760px; margin: 0 auto; }

  /* 格纹分割条 */
  .stripe {
    height: 14px;
    border-radius: 10px;
    margin: 26px 0;
    background-image: repeating-linear-gradient(
      45deg, #A98B79 0 10px, #fff 10px 20px
    );
    opacity: .35;
  }

  .card {
    background: #FFFFFF;
    border: 2px dashed #A98B79;
    border-radius: 26px;
    padding: 28px 26px;
    margin-bottom: 26px;
    position: relative;
  }

  h1 {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 30px;
    color: #333333;
  }

  h2 {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 21px;
    color: #A98B79;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #777777;
    background: #E9F5EF;
    border-radius: 12px;
    padding: 4px 12px;
    display: inline-block;
  }

  .sub { color: #777777; font-size: 14px; }

  .heart { color: #E8A8B8; }

  /* 头部 */
  .hero { text-align: center; padding: 38px 26px; }
  .hero .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    background: #E8A8B8; margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

  .item { padding: 14px 16px; background: #F6FBF8; border-radius: 18px; }
  .item b { font-family: 'Quicksand', sans-serif; }

  .skill { display: flex; flex-wrap: wrap; gap: 10px; }
  .skill span {
    background: #F6FBF8; border: 1.5px dashed #E8A8B8;
    color: #A98B79; border-radius: 16px; padding: 6px 14px;
    font-size: 14px;
  }

  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 560px) { .gallery { grid-template-columns: 1fr 1fr; } }
  .work {
    aspect-ratio: 1; border-radius: 20px; background: #F6FBF8;
    border: 1.5px dashed #A98B79; display: flex; align-items: center; justify-content: center;
    color: #777777; font-size: 13px; text-align: center;
  }

  .link { color: #E8A8B8; text-decoration: none; }
</style>
